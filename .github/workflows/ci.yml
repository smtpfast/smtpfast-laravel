name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        laravel: ["12", "13"]
        exclude:
          - php: "8.2"
            laravel: "13"
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: php --version
      # composer.json gets smtpfast/smtpfast-php from its GitHub repository until it is on Packagist.
      - name: Install Laravel ${{ matrix.laravel }}
        run: |
          composer require --no-update --no-interaction "illuminate/support:^${{ matrix.laravel }}.0"
          composer update --no-interaction --no-progress --prefer-dist --with-all-dependencies
      - run: composer show smtpfast/smtpfast-php laravel/framework | grep -E '^(name|versions|source)'
      - run: vendor/bin/phpunit
